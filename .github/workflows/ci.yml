name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gemini-kit/package-lock.json
            server/package-lock.json

      - name: Install and build gemini-kit
        run: npm ci --prefix gemini-kit

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Test server-kit
        run: npm run check --prefix server-kit

      - name: Test rules-kit
        run: npm run check --prefix rules-kit

      - name: Test gemini-kit
        run: npm run check --prefix gemini-kit

      - name: Test server
        run: npm test --prefix server

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client

      - name: Build client
        run: npm run build --prefix client
